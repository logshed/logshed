# Ruff lints the backend: `ruff check backend`. It is a linter only; the code is not
# reformatted with `ruff format`.
target-version = "py314"

[lint]
# Pyflakes (unused imports and variables, undefined names) and pycodestyle's
# import, statement and syntax errors. Import sorting is left out.
select = ["F", "E4", "E7", "E9"]
